description: Anobit Technologies was an Israeli fabless semiconductor company, founded in 2006, that
  developed flash-memory Memory Signal Processing (MSP) controller technology to extend the endurance,
  reliability, and performance of consumer-grade NAND flash used in SSDs and mobile devices. Backed
  by Battery Ventures among others, Anobit was acquired by Apple in early 2012 and no longer operates
  as an independent company. It has no public developer surface, API program, or live web presence,
  and remains in the API Evangelist network only as a historical portfolio-company record.
